<!DOCTYPE html>
<html>
    <head>
        <script src="index.js" defer></script>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="bodies" id="top">
            <h2 id="main-heading">Metric/Imperial Unit Conversion</h2>
            <input id="input" type="text">
            <button id="convert-btn">Convert</button>
        </div>
        <div class="bodies" id="bottom">
            <div class="unit-groups">
                <h4 class="unit-titles">Length (Meter/Feet)</h4>
                <p class="converted-output" id="meter-feet"></p>
            </div>
            <div class="unit-groups">
                <h4 class="unit-titles">Volume (Liters/Gallons)</h4>
                <p class="converted-output" id="liters-gallons"></p>
            </div>
            <div class="unit-groups">
                <h4 class="unit-titles">Mass (Kilograms/Pounds)</h4>
                <p class="converted-output" id="kilograms-pounds"></p>
            </div>
        </div>
    </body>
</html>
